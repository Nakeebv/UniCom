<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="UniCom — chat in every language.">
  <meta name="theme-color" content="#030A0B">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="UniCom">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>UniCom</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #030A0B; }
    /* Branded loader shown until Flutter paints its first frame, so a slow
       network never presents a blank white screen. */
    #unicom-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: radial-gradient(circle at 50% 38%, #0C3A44 0%, #030A0B 72%);
      z-index: 9999;
      transition: opacity .35s ease;
    }
    #unicom-loader.hidden { opacity: 0; pointer-events: none; }
    .unicom-mark {
      width: 84px; height: 84px; border-radius: 24px;
      display: flex; align-items: center; justify-content: center;
      font: 800 40px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #06211F;
      background: linear-gradient(150deg, #32D8F2, #0BBEDC);
      box-shadow: 0 10px 40px rgba(11, 190, 220, .35);
      animation: unicom-pop 1.6s ease-in-out infinite;
    }
    .unicom-name { font: 700 24px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #EAF7F9; letter-spacing: 1px; }
    .unicom-spinner {
      width: 30px; height: 30px; border-radius: 50%;
      border: 3px solid rgba(50, 216, 242, .25);
      border-top-color: #32D8F2;
      animation: unicom-spin .8s linear infinite;
    }
    @keyframes unicom-spin { to { transform: rotate(360deg); } }
    @keyframes unicom-pop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  </style>
</head>
<body>
  <div id="unicom-loader">
    <div class="unicom-mark">➤</div>
    <div class="unicom-name">UniCom</div>
    <div class="unicom-spinner"></div>
  </div>

  <script>
    // Hide the HTML loader as soon as Flutter has rendered its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('unicom-loader');
      if (!el) return;
      el.classList.add('hidden');
      setTimeout(function () { el.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
